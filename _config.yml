title: Wilson Fan
description: "Wilson Fan. Notes on software, and recipes worth repeating."
url: "https://wilson.fan"
timezone: Pacific/Auckland  # dates are NZ; GitHub builds in UTC and skips future-dated pages

markdown: kramdown
permalink: /:path.html

author: Wilson Fan
locale: en_NZ

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  recipes:
    output: true
    permalink: /:path.html
  notes:
    output: true
    permalink: /:path.html

defaults:
  - scope:
      path: ""
    values:
      image: /images/social/wilson_burger.jpg
  - scope:
      path: ""
      type: recipes
    values:
      seo:
        type: BlogPosting
      layout: recipe
      nav: recipes
  - scope:
      path: ""
      type: notes
    values:
      seo:
        type: BlogPosting
      layout: note
      nav: notes

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - serve.sh
  - gemini_key_do_not_commit.txt
