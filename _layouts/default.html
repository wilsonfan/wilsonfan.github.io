<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - Wilson Fan{% else %}Wilson Fan{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="{{ '/images/at-sign.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
</head>
<body>

  <header class="nav">
    <a href="{{ '/' | relative_url }}" class="wordmark">Wilson Fan</a>
    <nav>
      <a href="{{ '/notes.html' | relative_url }}"{% if page.nav == "notes" %} aria-current="page"{% endif %}>Notes</a>
      <a href="{{ '/recipes.html' | relative_url }}"{% if page.nav == "recipes" %} aria-current="page"{% endif %}>Recipes</a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3A9 9 0 0 1 12 21Z" fill="currentColor"/></svg>
      </button>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Wilson Fan &middot; <a href="#" data-email>Email</a></p>
  </footer>

  <script src="{{ '/js/email.js' | relative_url }}"></script>
  <script src="{{ '/js/theme.js' | relative_url }}"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "f9013b60e7234ca594ef679765c78de0"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
